<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Create Event — GatherPass Organizer</title>
 <meta name="description" content="Create and publish a new event on GatherPass with instant QR passes and gate scanner support.">
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
 <style>
 :root {
 --navy: #0b0f19;
 --navy-light: #111827;
 --purple: #6366f1;
 --purple-dark: #4f46e5;
 --blue: #2563eb;
 --blue-elec: #38bdf8;
 --green: #10b981;
 --gold: #f59e0b;
 --gold-warm: #fbbf24;
 --white: #f8fafc;
 --muted: #94a3b8;
 --card-bg: #131b2e;
 --card-border: #1e293b;
 --radius: 16px;
 --font: 'Inter', system-ui, sans-serif;
 }

 * { margin: 0; padding: 0; box-sizing: border-box; }
 body {
 font-family: var(--font);
 background: var(--navy);
 color: var(--white);
 min-height: 100vh;
 line-height: 1.6;
 padding-bottom: 5rem;
 }

 .container {
 max-width: 800px;
 margin: 0 auto;
 padding: 2rem 1.5rem;
 position: relative;
 }

 .nav-back {
 display: inline-flex;
 align-items: center;
 gap: .5rem;
 color: var(--muted);
 text-decoration: none;
 font-size: .95rem;
 margin-bottom: 2rem;
 transition: color .2s;
 }
 .nav-back:hover { color: var(--white); }

 .form-card {
 background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%);
 border: 1px solid var(--card-border);
 border-radius: var(--radius);
 padding: 2.5rem;
 backdrop-filter: blur(25px);
 box-shadow: 0 20px 50px rgba(0,0,0,0.5);
 }

 .form-header {
 margin-bottom: 2rem;
 padding-bottom: 1.5rem;
 border-bottom: 1px solid var(--card-border);
 }
 .page-title { font-size: 2rem; font-weight: 800; letter-spacing: -0.5px; }
 .page-sub { color: var(--muted); font-size: .95rem; margin-top: .3rem; }

 .form-group { margin-bottom: 1.5rem; }
 .form-label {
 display: block;
 font-size: .85rem;
 font-weight: 700;
 color: #e2e8f0;
 margin-bottom: .5rem;
 text-transform: uppercase;
 letter-spacing: .5px;
 }
 .form-input {
 width: 100%;
 background: rgba(0, 0, 0, 0.35);
 border: 1px solid var(--card-border);
 border-radius: 12px;
 padding: .85rem 1.1rem;
 color: #fff;
 font-family: inherit;
 font-size: 1rem;
 outline: none;
 transition: border-color .2s, box-shadow .2s;
 }
 .form-input:focus {
 border-color: var(--purple);
 box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
 }
 .form-row {
 display: grid;
 grid-template-columns: 1fr 1fr;
 gap: 1.25rem;
 }

 @media (max-width: 640px) {
 .form-row { grid-template-columns: 1fr; }
 .form-card { padding: 1.5rem; }
 }

 /* Image Dropzone */
 .dropzone {
 border: 2px dashed rgba(255, 255, 255, 0.2);
 border-radius: 14px;
 padding: 2rem 1.5rem;
 text-align: center;
 background: rgba(0, 0, 0, 0.25);
 cursor: pointer;
 transition: all .2s;
 }
 .dropzone:hover { border-color: var(--purple); background: rgba(99, 102, 241, 0.05); }

 .preview-box {
 position: relative;
 margin-top: .75rem;
 border-radius: 12px;
 overflow: hidden;
 border: 1px solid var(--card-border);
 }
 .preview-box img {
 width: 100%;
 height: 220px;
 object-fit: cover;
 display: block;
 }
 .btn-remove-img {
 position: absolute;
 top: 10px;
 right: 10px;
 background: rgba(0, 0, 0, 0.75);
 border: 1px solid rgba(255, 255, 255, 0.2);
 color: #fff;
 border-radius: 50%;
 width: 32px;
 height: 32px;
 cursor: pointer;
 font-weight: bold;
 display: flex;
 align-items: center;
 justify-content: center;
 }

 /* Actions Bar */
 .actions-bar {
 display: flex;
 gap: 1rem;
 margin-top: 2rem;
 padding-top: 1.5rem;
 border-top: 1px solid var(--card-border);
 }
 .btn {
 flex: 1;
 padding: 1rem 1.5rem;
 border-radius: 12px;
 font-weight: 700;
 font-size: 1rem;
 cursor: pointer;
 border: none;
 transition: all .2s;
 text-align: center;
 }
 .btn-publish {
 background: linear-gradient(135deg, var(--purple), #6366f1);
 color: #fff;
 box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
 }
 .btn-publish:hover {
 transform: translateY(-2px);
 box-shadow: 0 6px 25px rgba(124, 58, 237, 0.55);
 }
 .btn-draft {
 background: rgba(255, 255, 255, 0.06);
 color: var(--white);
 border: 1px solid var(--card-border);
 }
 .btn-draft:hover { background: rgba(255, 255, 255, 0.12); }

 /* Responsive Mobile Styles */
 @media (max-width: 640px) {
 .container { padding: 1.25rem 1rem; }
 .form-row { grid-template-columns: 1fr; gap: .75rem; }
 .form-card { padding: 1.25rem; border-radius: 16px; }
 .page-title { font-size: 1.5rem; }
 .actions-bar { flex-direction: column-reverse; gap: .75rem; }
 .btn { padding: .85rem; width: 100%; }
 .dropzone { padding: 1.5rem 1rem; }
 }
 </style>
</head>
<body>
 <div class="container">
 <a href="/planner" class="nav-back">
 <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Back to Organizer Dashboard
 </a>

 <div class="form-card">
 <div class="form-header">
 <h1 class="page-title">Create New Event</h1>
 <p class="page-sub">Fill in the event details to list your passes on GatherPass.</p>
 </div>

 <form id="createEventForm">
 <div class="form-group">
 <label class="form-label" for="evName">Event Name *</label>
 <input type="text" id="evName" class="form-input" placeholder="e.g. Accra AI & Cloud Summit 2026" required>
 </div>

 <div class="form-group">
 <label class="form-label" for="evDesc">Description *</label>
 <textarea id="evDesc" class="form-input" style="height: 110px; resize: vertical;" placeholder="Overview of the event, speakers, key topics, and schedule..." required></textarea>
 </div>

 <div class="form-row">
 <div class="form-group">
 <label class="form-label" for="evDate">Event Date *</label>
 <input type="date" id="evDate" class="form-input" required>
 </div>
 <div class="form-group">
 <label class="form-label" for="evTime">Start Time *</label>
 <input type="time" id="evTime" class="form-input" value="18:00" required>
 </div>
 </div>

 <div class="form-group">
 <label class="form-label" for="evVenue">Venue / Location *</label>
 <input type="text" id="evVenue" class="form-input" placeholder="e.g. Grand Arena, Accra International Conference Centre" required>
 </div>

 <div class="form-row">
 <div class="form-group">
 <label class="form-label" for="evPrice">Pass Price (GH₵) *</label>
 <input type="number" step="0.01" min="0" id="evPrice" class="form-input" placeholder="150.00" required>
 </div>
 <div class="form-group">
 <label class="form-label" for="evCapacity">Total Pass Capacity *</label>
 <input type="number" min="1" id="evCapacity" class="form-input" placeholder="500" required>
 </div>
 </div>

 <div class="form-group">
 <label class="form-label">Event Banner / Flyer Image</label>
 <div id="dropZone" class="dropzone">
 <input type="file" id="fileInput" accept="image/*" style="display: none;">
 <div id="uploadPrompt">
 <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--purple); margin-bottom: .5rem;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
 <p style="font-size: .95rem; color: #fff; font-weight: 700; margin-bottom: .25rem;">Drop flyer image here or click to browse</p>
 <p style="font-size: .8rem; color: var(--muted);">Supports PNG, JPG, or WEBP (Max 5MB)</p>
 </div>
 <div id="previewContainer" class="preview-box" style="display: none;">
 <img id="imagePreview" src="" alt="Banner Preview">
 <button type="button" class="btn-remove-img" onclick="removeImage(event)" title="Remove image"></button>
 </div>
 </div>
 <input type="hidden" id="evPicture" value="">
 <p style="font-size: .8rem; color: var(--muted); margin-top: .5rem;">Or enter image URL: <input type="text" id="evPictureUrl" placeholder="https://... or /uploads/..." class="form-input" style="padding: .5rem .75rem; font-size: .85rem; margin-top: .3rem;"></p>
 </div>

 <div class="actions-bar">
 <button type="button" id="btnDraft" class="btn btn-draft" onclick="submitEventForm('draft')">Save as Draft</button>
 <button type="button" id="btnPublish" class="btn btn-publish" onclick="submitEventForm('published')">Publish Event →</button>
 </div>
 </form>
 </div>
 </div>

 <script>
 // Set default date to 14 days from now
 const defaultDate = new Date(Date.now() + 86400000 * 14);
 document.getElementById('evDate').value = defaultDate.toISOString().split('T')[0];

 // Image upload handling
 const dropZone = document.getElementById('dropZone');
 const fileInput = document.getElementById('fileInput');
 const uploadPrompt = document.getElementById('uploadPrompt');
 const previewContainer = document.getElementById('previewContainer');
 const imagePreview = document.getElementById('imagePreview');
 const evPicture = document.getElementById('evPicture');
 const evPictureUrl = document.getElementById('evPictureUrl');

 dropZone.addEventListener('click', (e) => {
 if (e.target.tagName !== 'BUTTON') fileInput.click();
 });

 dropZone.addEventListener('dragover', (e) => {
 e.preventDefault();
 dropZone.style.borderColor = 'var(--purple)';
 });
 dropZone.addEventListener('dragleave', () => {
 dropZone.style.borderColor = 'rgba(255,255,255,0.2)';
 });
 dropZone.addEventListener('drop', (e) => {
 e.preventDefault();
 dropZone.style.borderColor = 'rgba(255,255,255,0.2)';
 if (e.dataTransfer.files && e.dataTransfer.files[0]) {
 handleFile(e.dataTransfer.files[0]);
 }
 });

 fileInput.addEventListener('change', (e) => {
 if (e.target.files && e.target.files[0]) {
 handleFile(e.target.files[0]);
 }
 });

 async function handleFile(file) {
 if (!file.type.startsWith('image/')) {
 alert('Please upload a valid image file (PNG, JPG, WEBP).');
 return;
 }

 const reader = new FileReader();
 reader.onload = async (event) => {
 const base64Data = event.target.result;
 imagePreview.src = base64Data;
 uploadPrompt.style.display = 'none';
 previewContainer.style.display = 'block';

 try {
 const res = await fetch('/api/upload', {
 method: 'POST',
 headers: { 'Content-Type': 'application/json' },
 body: JSON.stringify({
 image: base64Data,
 filename: file.name,
 contentType: file.type
 })
 });
 const data = await res.json();
 if (data.success && data.url) {
 evPicture.value = data.url;
 evPictureUrl.value = data.url;
 } else {
 evPicture.value = base64Data;
 }
 } catch(err) {
 evPicture.value = base64Data;
 }
 };
 reader.readAsDataURL(file);
 }

 function removeImage(e) {
 e.stopPropagation();
 fileInput.value = '';
 evPicture.value = '';
 evPictureUrl.value = '';
 imagePreview.src = '';
 uploadPrompt.style.display = 'block';
 previewContainer.style.display = 'none';
 }

 evPictureUrl.addEventListener('input', (e) => {
 const url = e.target.value.trim();
 if (url) {
 evPicture.value = url;
 imagePreview.src = url;
 uploadPrompt.style.display = 'none';
 previewContainer.style.display = 'block';
 }
 });

 async function submitEventForm(status) {
 const form = document.getElementById('createEventForm');
 if (!form.checkValidity()) {
 form.reportValidity();
 return;
 }

 const btnPublish = document.getElementById('btnPublish');
 const btnDraft = document.getElementById('btnDraft');
 btnPublish.disabled = true;
 btnDraft.disabled = true;

 const pictureValue = evPicture.value || evPictureUrl.value || 'https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=1200&q=80';

 const payload = {
 name: document.getElementById('evName').value.trim(),
 description: document.getElementById('evDesc').value.trim(),
 date: document.getElementById('evDate').value,
 time: document.getElementById('evTime').value,
 venue: document.getElementById('evVenue').value.trim(),
 base_ticket_price: document.getElementById('evPrice').value,
 capacity: document.getElementById('evCapacity').value,
 picture: pictureValue,
 status: status // 'published' or 'draft'
 };

 try {
 const res = await fetch('/api/planner', {
 method: 'POST',
 headers: { 'Content-Type': 'application/json' },
 body: JSON.stringify(payload)
 });
 const result = await res.json();
 if (result.success) {
 alert(status === 'published' ? ' Event published successfully!' : ' Event saved as draft.');
 window.location.href = `/planner/event-manage.html?id=${result.event.id}`;
 } else {
 alert(result.error || 'Failed to create event.');
 }
 } catch (err) {
 console.error(err);
 alert('Network error while saving event.');
 } finally {
 btnPublish.disabled = false;
 btnDraft.disabled = false;
 }
 }
 </script>
</body>
</html>
